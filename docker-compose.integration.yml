services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: integration-bootstrap-owner
      APP_POSTGRES_USER: ${APP_POSTGRES_USER}
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD}
    volumes:
      - ./tests/integration/sql/001_runtime_role.sql:/docker-entrypoint-initdb.d/001_runtime_role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: integration-root
      MINIO_ROOT_PASSWORD: integration-minio-secret
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_ROOT_USER: integration-root
      MINIO_ROOT_PASSWORD: integration-minio-secret
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb local/"$$MINIO_BUCKET" && touch /tmp/initialized && tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/initialized"]
      interval: 1s
      timeout: 2s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://land_valuation_migrator:integration-migration-owner@db:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql+psycopg://land_valuation_migrator:integration-migration-owner@db:5432/${POSTGRES_DB}
    entrypoint: ["/bin/sh", "-c"]
    command: ["alembic upgrade head && touch /tmp/migrated && tail -f /dev/null"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/migrated"]
      interval: 1s
      timeout: 2s
      retries: 10

  test:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      migrate:
        condition: service_healthy
      minio-init:
        condition: service_healthy
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c", "exec \"$$@\" $$PYTEST_ARGS", "--"]
    command: ["python", "-m", "pytest", "-q", "-p", "no:cacheprovider"]
    environment:
      APP_ENV: test
      RUN_INTEGRATION: "1"
      TEST_RUN_ID: ${TEST_RUN_ID}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: land_valuation_migrator
      POSTGRES_PASSWORD: integration-migration-owner
      MINIO_BUCKET: ${MINIO_BUCKET}
      APP_POSTGRES_USER: ${APP_POSTGRES_USER}
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD}
      DATABASE_URL: postgresql+psycopg://${APP_POSTGRES_USER}:${APP_POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql+psycopg://land_valuation_migrator:integration-migration-owner@db:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: integration-root
      MINIO_SECRET_KEY: integration-minio-secret
      MINIO_SECURE: "false"
      JWT_SECRET_KEY: integration-test-jwt-secret-at-least-32-bytes-long
      PYTEST_ARGS: ${PYTEST_ARGS:-}
      TMPDIR: /tmp
    volumes:
      - .:/workspace:ro
    tmpfs:
      - /tmp
