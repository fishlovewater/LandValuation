<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case-history API 測試台</title><style>
:root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#17202a;background:#f4f7fb}body{max-width:1200px;margin:auto;padding:24px}h1{margin-bottom:4px}.muted{color:#65758b}section{background:#fff;border:1px solid #dbe3ef;border-radius:12px;padding:18px;margin:16px 0}label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}input,select,textarea,button{font:inherit;border:1px solid #bdc9da;border-radius:7px;padding:9px}textarea{min-height:60px}button{cursor:pointer;background:#175cd3;color:#fff;border:0;font-weight:700}.secondary{background:#52647c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.actions{display:flex;gap:10px;margin-top:14px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px;border-bottom:1px solid #e7edf5}pre{white-space:pre-wrap;word-break:break-word;background:#111827;color:#d8e5f7;padding:14px;border-radius:9px;max-height:520px;overflow:auto}.error{color:#b42318;font-weight:700}.ok{color:#087a52;font-weight:700}
</style></head><body><h1>Case-history API 測試台</h1><p class="muted">僅供 development。JWT 只保存在本頁記憶體。</p>
<section><h2>登入</h2><div class="grid"><label>帳號<input id="username"></label><label>密碼<input id="password" type="password"></label></div><div class="actions"><button id="login">登入並取得 JWT</button></div><p id="login_status" class="muted"></p><label>JWT Bearer Token<textarea id="token" placeholder="也可以直接貼上 access token"></textarea></label></section>
<section><h2>案件搜尋</h2><div class="grid">
<label>關鍵字<input id="keyword" value="HIST-"></label><label>縣市<select id="city_code"><option value="">全部縣市</option><option value="31">新北市</option></select></label>
<label>行政區<select id="district_code" disabled><option value="">請先選擇縣市</option></select></label><label>地段<input id="section_name" placeholder="測試段"></label>
<label>結果<select id="result"><option value="">全部</option><option>PASSED</option><option>CORRECTION</option><option>RETURNED</option><option>SUPPLEMENT_REQUIRED</option><option>IN_PROGRESS</option></select></label>
<label>排序<select id="sort"><option>updated_at</option><option>received_at</option><option>risk_level</option></select></label>
<label>順序<select id="order"><option>desc</option><option>asc</option></select></label><label>每頁<input id="limit" type="number" min="1" max="100" value="20"></label></div>
<div class="actions"><button id="search">搜尋</button><button class="secondary" id="clear">清除條件</button></div><p id="status" class="muted"></p>
<div style="overflow:auto"><table><thead><tr><th>案件編號</th><th>名稱</th><th>結果</th><th>模組</th><th>SQL</th><th>metadata</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section><h2>API 回應／案件詳情</h2><div id="documents" class="actions"></div><pre id="output">尚未執行。</pre></section>
<script>
const $=id=>document.getElementById(id);const apiBase=location.pathname.replace(/\/history\/test-ui\/?$/,'');
const districts={31:[['3101','板橋區'],['3102','三重區'],['3103','永和區'],['3104','中和區'],['3105','新店區'],['3106','新莊區'],['3107','樹林區'],['3108','鶯歌區'],['3109','三峽區'],['3110','淡水區'],['3111','汐止區'],['3112','瑞芳區'],['3113','土城區'],['3114','蘆洲區'],['3115','五股區'],['3116','泰山區'],['3117','林口區'],['3118','深坑區'],['3119','石碇區'],['3120','坪林區'],['3121','三芝區'],['3122','石門區'],['3123','八里區'],['3124','平溪區'],['3125','雙溪區'],['3126','貢寮區'],['3127','金山區'],['3128','萬里區'],['3129','烏來區']]};
function updateDistricts(){const city=$('city_code').value;const options=districts[city]||[];$('district_code').replaceChildren(new Option(city?'全部行政區':'請先選擇縣市',''),...options.map(([code,name])=>new Option(name,code)));$('district_code').disabled=!city}
function headers(){return{Authorization:`Bearer ${$('token').value.trim()}`}}
async function request(path){const r=await fetch(`${apiBase}${path}`,{headers:headers()});const t=r.headers.get('content-type')||'';const b=t.includes('json')?await r.json():await r.text();if(!r.ok)throw Error(typeof b==='string'?b:JSON.stringify(b,null,2));return b}
async function login(){try{const r=await fetch(`${apiBase}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(JSON.stringify(d));$('token').value=d.access_token;$('login_status').className='ok';$('login_status').textContent='登入成功，JWT 已放入下方欄位'}catch(e){$('login_status').className='error';$('login_status').textContent=e.message}}
function textCell(value){const td=document.createElement('td');td.textContent=String(value);return td}
async function search(){try{$('status').className='muted';$('status').textContent='查詢中…';const p=new URLSearchParams();for(const id of['keyword','city_code','district_code','section_name','result','sort','order','limit'])if($(id).value)p.set(id,$(id).value);const data=await request(`/history/cases?${p}`);$('output').textContent=JSON.stringify(data,null,2);$('rows').replaceChildren(...data.items.map(x=>{const tr=document.createElement('tr');for(const value of[x.case_no,x.case_title,x.history_result,x.visible_modules.join(', '),x.has_structured_data?'是':'否',x.has_document_metadata?'是':'否'])tr.append(textCell(value));const action=document.createElement('td');const button=document.createElement('button');button.textContent='詳情';button.onclick=()=>detail(x.case_id);action.append(button);tr.append(action);return tr}));$('status').className='ok';$('status').textContent=`共 ${data.total} 筆`}catch(e){$('status').className='error';$('status').textContent=e.message}}
async function detail(id){try{const d=await request(`/history/cases/${id}`);$('output').textContent=JSON.stringify(d,null,2);$('documents').replaceChildren(...d.documents.map(x=>{const b=document.createElement('button');b.textContent=`下載 ${x.file_name}`;b.onclick=()=>downloadFile(x);return b}))}catch(e){$('output').textContent=e.message}}
async function downloadFile(doc){try{const r=await fetch(`${apiBase}/history/documents/${doc.document_id}/download`,{headers:headers()});if(!r.ok){const body=await r.text();throw Error(body)}const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=doc.file_name;document.body.append(a);a.click();a.remove();URL.revokeObjectURL(a.href)}catch(e){$('output').textContent=`下載失敗：${e.message}`}}
$('login').onclick=login;$('search').onclick=search;$('city_code').onchange=updateDistricts;$('clear').onclick=()=>{for(const id of['keyword','city_code','section_name','result'])$(id).value='';updateDistricts()};
</script></body></html>
